name: Android Build

on:
  push:
    branches:
      - main
      - feature/monitoring-service
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Locate debug APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for generated APK..."
          find . -type f -name '*.apk' -print
          APK_PATH="$(find . -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No Debug APK was found."
            exit 1
          fi
          echo "Found: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: TetherGuardian-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
