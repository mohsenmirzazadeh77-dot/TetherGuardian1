name: Android Build

on:
  push:
    branches:
      - main
      - feature/monitoring-service
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode --ignore-garbage > tetherguardian-release.jks
          test -s tetherguardian-release.jks
          file tetherguardian-release.jks

      - name: Verify release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore tetherguardian-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias tetherguardian >/dev/null

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: tetherguardian
        run: gradle --no-daemon assembleRelease

      - name: Locate Release APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching for generated APK..."
          find . -type f -name '*.apk' -print
          APK_PATH="$(find . -type f -path '*/build/outputs/apk/release/*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No Release APK was found."
            exit 1
          fi
          echo "Found: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: TetherGuardian-release-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
