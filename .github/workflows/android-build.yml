name: Android Build

on:
  push:
    branches:
      - main
      - feature/main-ui-refresh
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | sed '/-----BEGIN CERTIFICATE-----/d;/-----END CERTIFICATE-----/d' | tr -d '\r\n ' | base64 --decode > tetherguardian-release.jks

      - name: Verify release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -keystore tetherguardian-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias tetherguardian >/dev/null

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: tetherguardian
        run: gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TetherGuardian-release-apk
          path: app/build/outputs/apk/release/app-release.apk
